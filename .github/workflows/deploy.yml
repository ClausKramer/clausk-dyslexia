name: Deploy til Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC-login til Azure
  contents: read

env:
  RESOURCE_GROUP: rg-clausk-dyslexia
  SWA_NAME: swa-clausk-dyslexia

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Infrastruktur og upload
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.infra.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Byg dist/
        run: node scripts/build.js

      - name: Log ind i Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastruktur (Bicep)
        id: infra
        run: |
          URL=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters name="$SWA_NAME" \
            --query properties.outputs.url.value -o tsv)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Spillet får adressen $URL"

      - name: Hent deployment-token
        id: token
        run: |
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload til Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
